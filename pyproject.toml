[project]
name = "claude-workspace-init"
version = "0.1.0"
description = "Opinionated Claude Code workspace bootstrapper: start with everything available, finish with only what the project needs."
readme = "README.MD"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "inquirerpy>=0.3.4",
    "pydantic>=2.6",
]

[project.scripts]
cwi = "cwi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "tests/fixtures",
    # catalog Markdown is instructions for Claude, not project code: never reformat it
    "catalog/**/*.md",
    # third-party catalog content is kept verbatim (see README › Credits)
    "catalog/skills/agent-self-evaluation",
    "catalog/skills/continuous-learning-v2",
    "catalog/skills/delivery-gate",
    "catalog/skills/docs-governance",
    "catalog/skills/frontend-slides",
    "catalog/skills/manim-video",
    "catalog/skills/openclaw-persona-forge",
    "catalog/skills/operator-approval-loop",
    "catalog/skills/skill-comply",
    "catalog/skills/taste-application",
    "catalog/skills/taste-distillation",
    "catalog/skills/videodb",
    "catalog/skills/archify",
    "new_skills",
    "new_agents",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
